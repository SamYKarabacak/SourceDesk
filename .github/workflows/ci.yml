name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt
      - name: Install verified dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt -c requirements-lock.txt
      - name: Check environment
        run: python scripts/doctor.py
      - name: Check first-run launcher
        run: python run.py --check
      - name: Check style
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests
        run: python -m pytest -q
      - name: Run retrieval baseline
        run: python scripts/evaluate.py
      - name: Build source archive
        run: python scripts/package.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application and browser tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements.txt -c requirements-lock.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend and browser workflow
        run: |
          npm run check:frontend
          npm run test:browser
